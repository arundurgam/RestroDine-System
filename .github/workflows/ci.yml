name: Restaurant System CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-backend:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - auth-service
          - restaurant-service
          - order-service
          - inventory-service
          - api-gateway
          - discovery-server
          - delivery-service
          - notification-service

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        run: mvn clean package

  build-frontend:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        working-directory: restrodine-frontend
        run: npm install

      - name: Build React App
        working-directory: restrodine-frontend
        run: npm run build